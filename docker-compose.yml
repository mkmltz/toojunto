services:
  db:
    image: postgres:16-alpine
    container_name: toojunto-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toojunto}
      POSTGRES_USER: ${POSTGRES_USER:-toojunto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toojunto_dev}
    ports:
      - "5432:5432"
    volumes:
      - toojunto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toojunto -d toojunto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toojunto_pgdata:
